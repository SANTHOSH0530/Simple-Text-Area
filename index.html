<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Character Counter</title>
  <link href="./src/output.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen" style="font-family: 'Poppins', sans-serif;">

  <div class="bg-white p-6 rounded-lg shadow w-96">
    <h1 class="text-xl font-bold mb-2">Write a message</h1>
    <p class="text-gray-500 mb-4">Maximum 200 characters</p>

    <textarea id="message" rows="5" maxlength="200"
      class="w-full border rounded p-2"></textarea>

    <p id="counter" class="mt-2 text-gray-700">0/200 characters, 200 remaining</p>

    <p id="warning" class="mt-2 text-red-600 font-semibold hidden">
      Limit reached! Mela type panna mudiyathu.
    </p>

    <!-- Buttons -->
    <div class="flex gap-3 mt-5">
      <button id="copyBtn"
        class="flex-1 bg-blue-600 text-white font-medium py-2 px-4 rounded-lg shadow-sm
               hover:bg-blue-700 active:scale-95 transition duration-150 cursor-pointer">
        Copy
      </button>

      <button id="clearBtn"
        class="flex-1 bg-white text-gray-700 font-medium py-2 px-4 rounded-lg border border-gray-300
               hover:bg-gray-100 active:scale-95 transition duration-150 cursor-pointer">
        Clear
      </button>
    </div>

    <!-- Copy success message -->
    <p id="copyMsg" class="mt-3 text-center text-sm font-medium text-green-600 hidden">
      Copied!
    </p>
  </div>

  <script>
    const textarea = document.getElementById("message");
    const counter = document.getElementById("counter");
    const warning = document.getElementById("warning");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyMsg = document.getElementById("copyMsg");
    const MAX = 200;

    // Counter update function
    function updateCounter() {
      const typed = textarea.value.length;
      const remaining = MAX - typed;

      counter.textContent = typed + "/" + MAX + " characters, " + remaining + " remaining";

      if (remaining === 0) {
        warning.classList.remove("hidden");
      } else {
        warning.classList.add("hidden");
      }
    }

    // Type pannum pothu counter update aagum
    textarea.addEventListener("input", updateCounter);

    // Copy button: textarea la irukura text ah clipboard ku copy pannum
    copyBtn.addEventListener("click", function () {
      navigator.clipboard.writeText(textarea.value);
      copyMsg.classList.remove("hidden");
      setTimeout(function () {
        copyMsg.classList.add("hidden");
      }, 1500);
    });

    // Clear button: textarea ah kaali pannum
    clearBtn.addEventListener("click", function () {
      textarea.value = "";
      updateCounter();
      copyMsg.classList.add("hidden");
      textarea.focus();
    });
  </script>
</body>
</html>
